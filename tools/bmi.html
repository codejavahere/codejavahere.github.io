<!DOCTYPE html><html><body><h1>BMI计算器</h1><input id='h' placeholder='身高cm'><input id='w' placeholder='体重kg'><button onclick='c()'>计算</button><div id='r'></div><script>function c(){let h=document.getElementById('h').value/100;let w=document.getElementById('w').value;document.getElementById('r').innerText='BMI='+(w/(h*h)).toFixed(2);}</script></body></html>
