<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Markdown 日记详情 · CodeJavaHere"><title>日记 · CodeJavaHere</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="./">Diary<span>.</span></a><nav><a href="./">时间线</a><a href="about.html">关于</a><a href="https://github.com/codejavahere/codejavahere.github.io" target="_blank" rel="noopener">GitHub ↗</a></nav></div></header><main class="container article"><a class="back" href="./">← 返回时间线</a><header class="article-head"><div id="meta" class="article-meta">加载中…</div><h1 id="title">加载日记…</h1><div id="tags" class="tags"></div></header><article id="content" class="markdown"></article></main><footer class="container footer">© <span id="yearNow"></span> CodeJavaHere</footer><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script>const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function init(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){location.href='./';return}try{const index=await fetch('diary/index.json').then(r=>r.json());const item=index.find(x=>x.slug===slug);if(!item)throw Error();document.title=item.title+' · Diary';document.getElementById('meta').textContent=item.date;document.getElementById('title').textContent=item.title;document.getElementById('tags').innerHTML=(item.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');const md=await fetch('diary/'+encodeURIComponent(item.file)).then(r=>r.text());document.getElementById('content').innerHTML=DOMPurify.sanitize(marked.parse(md));}catch(e){document.getElementById('title').textContent='日记不存在';document.getElementById('content').textContent='无法加载这篇日记。'}}document.getElementById('yearNow').textContent=new Date().getFullYear();init();</script></body></html>
