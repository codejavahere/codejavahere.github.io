<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JSON Studio · JSON 格式化、折叠、转义与查看工具"><title>JSON Studio · CodeJavaHere</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">{ }</span><span>JSON Studio</span></div><div class="toolbar">
<button class="primary" id="formatBtn">格式化</button><i></i><label class="check"><input id="wrapToggle" type="checkbox">长行换行</label>
<label class="select"><span>缩进</span><select id="indentSelect"><option value="2">2 空格</option><option value="4">4 空格</option><option value="tab">Tab</option></select></label><i></i>
<button id="escapeBtn">转义</button><button id="unescapeBtn">去除转义</button><label class="select"><span>展开层级</span><select id="levelSelect"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="all">全部</option></select></label>
<button id="expandAllBtn">全部展开</button><button id="collapseAllBtn">全部关闭</button><button id="copyBtn">复制</button></div></header>
<main class="workspace"><section class="panel"><div class="panel-head"><b>原始数据</b><small>可编辑 · 仅触发格式化</small><em id="sourceStatus"></em></div><div class="editor-shell"><div class="gutter" id="sourceGutter"></div><div class="editor-scroll" id="sourceScroll"><div class="source-editor" id="sourceEditor" contenteditable="true" spellcheck="false"></div></div></div></section><div class="splitter"></div>
<section class="panel"><div class="panel-head"><b>格式化数据</b><small>只读 · 浏览 / 格式化 / 复制 / 转义</small><em id="resultStatus"></em></div><div class="editor-shell"><div class="gutter" id="resultGutter"></div><div class="editor-scroll" id="resultScroll"><div class="result-editor" id="resultEditor"></div></div></div></section></main>
<footer class="statusbar"><span id="message">准备就绪</span><span>纯前端运行 · 数据不会上传服务器</span></footer><script src="assets/app.js"></script></body></html>
