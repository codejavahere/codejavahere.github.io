<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>CodeJavaHere 工具箱</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;max-width:1100px;margin:auto;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:#1e1e1e;padding:20px;border-radius:12px}.input{width:100%;padding:10px;margin:8px 0}.btn{padding:10px 14px;background:#fff;color:#000;border:none;cursor:pointer}.result{margin-top:10px;font-weight:bold}</style></head><body><h1>🛠 CodeJavaHere 工具箱</h1><p>持续增加各种实用小工具。</p><div class='grid'><div class='card'><h2>薪资计算器</h2><input id='salary' class='input' type='number' placeholder='税前工资'><button class='btn' onclick='calcSalary()'>计算</button><div id='salaryResult' class='result'></div></div><div class='card'><h2>花销统计器</h2><input id='expense' class='input' type='number' placeholder='输入花销'><button class='btn' onclick='addExpense()'>添加</button><div id='expenseResult' class='result'>总花销: 0</div></div></div><script>let total=0;function calcSalary(){const s=Number(document.getElementById('salary').value||0);document.getElementById('salaryResult').innerText='预估到手: '+(s*0.8).toFixed(2);}function addExpense(){total+=Number(document.getElementById('expense').value||0);document.getElementById('expenseResult').innerText='总花销: '+total.toFixed(2);}</script></body></html>
